name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate HTML
        run: node scripts/build_html.cjs

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const project = 'mynovel';

          const htmlPath = path.join(__dirname, '../../dist/index.html');
          const htmlContent = fs.readFileSync(htmlPath);
          const b64 = htmlContent.toString('base64');

          // Get upload URL
          const getUploadUrl = () => new Promise((resolve, reject) => {
            const options = {
              hostname: 'api.cloudflare.com',
              path: \`/client/v4/accounts/\${accountId}/pages/projects/\${project}/deployments/upload-url\`,
              method: 'GET',
              headers: { 'Authorization': 'Bearer ' + apiToken }
            };
            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try { resolve(JSON.parse(data)); }
                catch(e) { reject(new Error('Parse error: ' + data)); }
              });
            });
            req.on('error', reject);
            req.end();
          });

          // Upload file
          const uploadFile = (uploadUrl, filename, contentType, body) => new Promise((resolve, reject) => {
            const url = new URL(uploadUrl);
            const options = {
              hostname: url.hostname,
              path: url.pathname + url.search,
              method: 'PUT',
              headers: { 'Content-Type': contentType }
            };
            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => resolve({ status: res.statusCode, data }));
            });
            req.on('error', reject);
            req.write(body);
            req.end();
          });

          // Create deployment
          const createDeployment = (manifest) => new Promise((resolve, reject) => {
            const payload = JSON.stringify({ files: manifest });
            const options = {
              hostname: 'api.cloudflare.com',
              path: \`/client/v4/accounts/\${accountId}/pages/projects/\${project}/deployments\`,
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + apiToken,
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(payload)
              }
            };
            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try { resolve(JSON.parse(data)); }
                catch(e) { reject(new Error('Parse error: ' + data)); }
              });
            });
            req.on('error', reject);
            req.write(payload);
            req.end();
          });

          async function main() {
            console.log('Getting upload URL...');
            const urlResult = await getUploadUrl();
            if (!urlResult.success) {
              console.error('Failed to get upload URL:', JSON.stringify(urlResult.errors));
              process.exit(1);
            }
            const uploadUrl = urlResult.result.uploadURL;
            console.log('Uploading index.html...');
            const uploadResult = await uploadFile(uploadUrl, 'index.html', 'text/html', htmlContent);
            console.log('Upload status:', uploadResult.status);
            console.log('Creating deployment...');
            const deployResult = await createDeployment([{
              path: 'index.html',
              content: b64,
              contentType: 'text/html'
            }]);
            if (!deployResult.success) {
              console.error('Deploy failed:', JSON.stringify(deployResult.errors));
              process.exit(1);
            }
            console.log('Deployment created:', deployResult.result.id);
            console.log('URL:', deployResult.result.url);
          }

          main().catch(e => { console.error(e); process.exit(1); });
          "
