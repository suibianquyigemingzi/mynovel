name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 8 AM and 8 PM MDT (Edmonton = UTC-6)
    # 8 AM MDT = 14:00 UTC
    # 8 PM MDT = 02:00 UTC next day
    - cron: "0 14 * * *"
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: node scripts/build_html.cjs

      - name: Commit and push dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/suibianquyigemingzi/mynovel.git"
          git add -f dist/
          git commit -m "build: $(date -u '+%Y-%m-%d %H:%M UTC')" --allow-empty || true
          git push origin main
