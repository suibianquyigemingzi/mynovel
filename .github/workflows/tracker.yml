name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 6 AM and 6 PM MDT
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx astro build

      # Replace the Astro-generated index.html with the tracker HTML
      # (which contains the live ranking data with proper Chinese chars)
      - name: Inject tracker HTML
        run: |
          # Copy the generated tracker site index.html to dist/index.html
          # This replaces the Astro-built index.html with our tracker
          cp data/site/index.html dist/index.html
          echo "Replaced dist/index.html with tracker HTML ($(wc -c < data/site/index.html) bytes)"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/ --project-name=mynovel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}