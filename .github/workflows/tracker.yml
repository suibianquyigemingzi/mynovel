name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 6 AM and 6 PM MDT
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx astro build

      # Replace Astro's output with the tracker HTML (proper UTF-8 Chinese)
      - run: cp data/site/index.html dist/index.html && echo "Replaced with tracker HTML ($(wc -c < data/site/index.html) bytes)"

      - run: git add -f dist/ && git commit -m "chore: deploy tracker site $(date -u '+%Y-%m-%d %H:%M UTC')" && git push