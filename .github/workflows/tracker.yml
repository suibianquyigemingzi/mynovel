name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 6 AM and 6 PM MDT
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx astro build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/ --project-name=mynovel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}