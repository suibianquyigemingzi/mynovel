name: Qidian Tracker & Deploy

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run collector
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data
          TOP_N: "20"
          KEEP_DAYS: "31"
        run: python scripts/collect_rankings.py

      - name: Run analyzer + HTML builder
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data
        run: python scripts/analyze_and_build.py

      - name: Inject tracker HTML into Astro page
        run: python scripts/inject_tracker.py

      - name: Build Astro site
        run: npx astro build

      - name: Commit and push
        run: |
          git config --local user.email "bot@mynovel.me"
          git config --local user.name "mynovel bot"
          git add -f data/latest data/snapshots data/analysis src/pages/index.astro dist/
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "chore: update rankings data and site $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
          }