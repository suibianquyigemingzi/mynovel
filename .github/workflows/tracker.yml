name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 8 AM and 8 PM MDT (Edmonton = UTC-6)
    # 8 AM MDT = 14:00 UTC
    # 8 PM MDT = 02:00 UTC next day
    - cron: "0 14 * * *"
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: node scripts/build_html.cjs

      - run: echo "dist built via build_html.cjs, committed by build.yml"
