name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 6 AM and 6 PM MDT (Edmonton = UTC-6)
    # 6 AM MDT = 12:00 UTC
    # 6 PM MDT = 00:00 UTC next day
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: node scripts/build_html.cjs

      - run: |
          cp data/site/index.html dist/index.html
          echo "Deployed tracker HTML ($(wc -c < data/site/index.html) bytes)"

      - run: |
          git config user.name "mynovel-bot"
          git config user.email "bot@mynovel"
          git add -f dist/ && git commit --allow-empty -m "deploy: tracker $(date -u '+%Y-%m-%d %H:%M UTC')" && git push
