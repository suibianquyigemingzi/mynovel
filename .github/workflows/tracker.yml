name: Qidian Tracker & Deploy

on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 and 18:00 UTC = 14:00 and 02:00 MDT
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run collector
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data
          TOP_N: "20"
          KEEP_DAYS: "31"
        run: python scripts/collect_rankings.py

      - name: Run analyzer + HTML builder
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data
        run: python scripts/analyze_and_build.py

      - name: Inject tracker HTML into Astro page
        run: python scripts/inject_tracker.py

      - name: Commit updated data and Astro page
        run: |
          git config --local user.email "bot@mynovel.me"
          git config --local user.name "mynovel bot"
          git add data/latest data/snapshots data/analysis src/pages/index.astro scripts/inject_tracker.py
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: update rankings data and site $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main